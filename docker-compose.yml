services:
  parkpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: parkpulse:local
    ports:
      - "8000:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5