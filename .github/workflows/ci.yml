name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: docker build -t parkpulse:test .
      - run: docker run -d --name parkpulse -p 8080:8080 parkpulse:test
      - run: sleep 3; curl --fail http://localhost:8080/health
      - run: docker rm -f parkpulse