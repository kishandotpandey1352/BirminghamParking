name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Test, build, and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Lint backend
        run: ruff check .

      - name: Run backend tests
        run: pytest -q

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Build Docker image
        run: docker build -t parkpulse:test .

      - name: Start container
        run: docker run -d --name parkpulse -p 8080:8080 parkpulse:test

      - name: Wait for health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs parkpulse
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm -f parkpulse
