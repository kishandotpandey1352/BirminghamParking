name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run release checks
        run: |
          ruff check .
          pytest -q
          python scripts/validate_release.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/parkpulse:latest
            ghcr.io/${{ github.repository_owner }}/parkpulse:${{ github.sha }}

      - name: Print published image tags
        run: |
          echo "Published:"
          echo "ghcr.io/${{ github.repository_owner }}/parkpulse:latest"
          echo "ghcr.io/${{ github.repository_owner }}/parkpulse:${{ github.sha }}"
