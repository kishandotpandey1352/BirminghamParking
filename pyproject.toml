[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkpulse"
version = "0.1.0"
description = "A teachable parking occupancy forecasting and monitoring demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "joblib==1.4.2",
  "numpy==2.2.1",
  "pandas==2.2.3",
  "pydantic==2.10.4",
  "pytz==2024.2",
  "scikit-learn==1.6.1",
  "scipy==1.15.0",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["parkpulse*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
